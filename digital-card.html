<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكارت الشخصي الرقمي</title>
<meta name="theme-color" content="#060b1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
  /* ====== الألوان — عدّلها من هنا ====== */
  :root {
    --bg: #060b1c;
    --gold: #00ADEF; /* سماوي Digivision */
    --brand-blue: #203F99; /* أزرق Digivision */
    --gold-soft: #8fdcfa;
    --text: #FFFFFF;
    --muted: #aebbd9;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(0, 173, 239, 0.32);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
    position: relative;
    overflow-x: hidden;
  }

  /* خلفية: توهّج ذهبي خلف الزجاج ليظهر تأثير Glassmorphism */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 340px; height: 340px; background: rgba(0,173,239,.30); top: -90px; right: -90px; }
  body::after  { width: 300px; height: 300px; background: rgba(32,63,153,.55); bottom: -80px; left: -80px; }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 32px 22px 26px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14);
  }

  /* ====== الصورة / الشعار ====== */
  /* ====== شعار الشركة (أعلى الكارت) ====== */
  .brand {
    display: flex; align-items: center; justify-content: center;
    background: #FFFFFF;               /* لوحة بيضاء تُظهر الشعار بألوانه الأصلية */
    border-radius: 18px;
    padding: 10px 18px;
    margin-bottom: 26px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .brand img { height: 66px; max-width: 100%; object-fit: contain; }
  .brand span { font-size: 22px; font-weight: 800; letter-spacing: .5px; color: #203F99; direction: ltr; }

  .avatar-wrap {
    width: 128px; height: 128px;
    margin: 0 auto 18px;
    padding: 4px;
    border-radius: 50%;
    background: conic-gradient(from 200deg, var(--gold), var(--brand-blue), var(--gold-soft), var(--gold));
  }
  .avatar {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 20%;
    background: #0b1430;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 800; color: var(--gold);
  }

  .name { text-align: center; font-size: 28px; font-weight: 800; color: var(--gold-soft); line-height: 1.3; }
  .title { text-align: center; font-size: 16px; font-weight: 500; margin-top: 4px; }
  .company { text-align: center; font-size: 14px; color: var(--gold); margin-top: 2px; }
  .bio { text-align: center; font-size: 14px; color: var(--muted); line-height: 1.8; margin: 14px 6px 22px; }

  /* ====== الأزرار ====== */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 14px 16px;
    border-radius: 16px;
    font: inherit; font-size: 16px; font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid var(--glass-border);
    color: var(--text);
    background: var(--glass);
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: rgba(0,173,239,.16); border-color: var(--gold); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible, .social a:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }

  .btn-primary {
    background: linear-gradient(135deg, #5fd0f8, var(--gold) 60%, #0c8fd0);
    color: #04122b;
    border: none;
    font-size: 18px;
    padding: 17px 16px;
    margin-bottom: 12px;
    box-shadow: 0 10px 26px rgba(0,173,239,.32);
  }
  .btn-primary:hover { background: linear-gradient(135deg, #a6e6fc, #5fd0f8 55%, var(--gold)); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .grid .btn { font-size: 15px; padding: 13px 10px; }
  .btn svg { width: 20px; height: 20px; flex: none; fill: currentColor; }
  .wa svg { fill: #25d366; }

  .btn-wide { margin-bottom: 10px; }

  /* ====== التواصل الاجتماعي ====== */
  .social { display: flex; justify-content: center; gap: 12px; margin: 18px 0 16px; flex-wrap: wrap; }
  .social a {
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--gold-soft);
    transition: background .15s ease, transform .15s ease;
  }
  .social a:hover { background: rgba(0,173,239,.2); transform: translateY(-2px); }
  .social svg { width: 21px; height: 21px; fill: currentColor; }

  .address { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; }

  /* رسالة التأكيد */
  .toast {
    position: fixed; bottom: 26px; left: 50%;
    transform: translate(-50%, 30px);
    background: #0a1530; color: var(--gold-soft);
    border: 1px solid var(--gold);
    padding: 12px 20px; border-radius: 14px;
    font-size: 14px; font-weight: 700;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<body>

<main class="card">

  <!-- شعار الشركة: ضع رابطه في CONFIG.logo -->
  <div class="brand" id="brand"></div>

  <div class="avatar-wrap"><div class="avatar" id="avatar"></div></div>

  <button class="btn btn-primary" id="saveBtn" type="button">
    <span>حفظ جهة الاتصال 📥</span>

  <div class="grid">
    <a class="btn wa" id="waBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12.04 2a9.93 9.93 0 0 0-8.5 15.07L2 22l5.07-1.5A9.94 9.94 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.44 1.34-1.98 1.4-.5.07-1.14.1-1.84-.12-.42-.14-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.37-.14-.2-1.17-1.56-1.17-2.97 0-1.42.74-2.12 1-2.4.27-.3.58-.37.78-.37h.56c.18 0 .43-.07.67.5.25.6.85 2.07.92 2.22.08.15.13.32.02.52-.1.2-.15.32-.3.5-.15.17-.32.38-.45.52-.15.15-.3.3-.13.6.17.3.77 1.27 1.65 2.05 1.13 1 2.08 1.32 2.38 1.47.3.15.47.12.65-.07.17-.2.75-.87.95-1.17.2-.3.4-.25.67-.15.27.1 1.7.8 2 .95.3.15.5.22.57.35.08.12.08.72-.17 1.42z"/></svg>
      واتساب
    </a>
    <a class="btn" id="callBtn">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
      اتصال
    </a>
    <a class="btn" id="mailBtn">
      <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
      بريد إلكتروني
    </a>
    <a class="btn" id="mapBtn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      الموقع
    </a>
  </div>

  <a class="btn btn-wide" id="siteBtn" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 9h-3a15.7 15.7 0 0 0-1.4-5A8 8 0 0 1 18.9 11zM12 4c.8 1 1.6 3 1.9 7h-3.8c.3-4 1.1-6 1.9-7zM4.3 13h3a15.7 15.7 0 0 0 1.4 5A8 8 0 0 1 4.3 13zm3-2h-3A8 8 0 0 1 8.5 6a15.7 15.7 0 0 0-1.2 5zM12 20c-.8-1-1.6-3-1.9-7h3.8c-.3 4-1.1 6-1.9 7zm3.5-2a15.7 15.7 0 0 0 1.4-5h3a8 8 0 0 1-4.4 5z"/></svg>
    زيارة الموقع
  </a>

  <button class="btn btn-wide" id="shareBtn" type="button">مشاركة الكارت 🔗</button>

  <!-- روابط التواصل الاجتماعي (تُبنى تلقائيًا من CONFIG.social) -->
  <nav class="social" id="social" aria-label="حسابات التواصل الاجتماعي"></nav>

  <p class="address" id="address"></p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ============ تعبئة الصفحة ============ */
const $ = id => document.getElementById(id);

document.title = CONFIG.name + " | كارت شخصي";
$("name").textContent    = CONFIG.name;
$("title").textContent   = CONFIG.title;
$("company").textContent = CONFIG.company;
$("bio").textContent     = CONFIG.bio;
$("address").textContent = "📍 " + CONFIG.address;

// شعار الشركة
const brand = $("brand");
function brandText() {
  const t = document.createElement("span");
  t.textContent = CONFIG.company;
  return t;
}
if (CONFIG.logo) {
  const logo = document.createElement("img");
  logo.src = CONFIG.logo;
  logo.alt = CONFIG.company;
  logo.onerror = () => logo.replaceWith(brandText());
  brand.appendChild(logo);
} else {
  brand.appendChild(brandText());
}

// الصورة أو الحرف الأول
const avatar = $("avatar");
if (CONFIG.photo) {
  const img = document.createElement("img");
  img.src = CONFIG.photo;
  img.alt = CONFIG.name;
  img.className = "avatar";
  img.onerror = () => { img.replaceWith(initial()); };
  avatar.replaceWith(img);
} else {
  avatar.textContent = CONFIG.name.trim().charAt(0);
}
function initial() {
  const d = document.createElement("div");
  d.className = "avatar";
  d.textContent = CONFIG.name.trim().charAt(0);
  return d;
}

// الروابط المباشرة
$("waBtn").href   = "https://wa.me/" + CONFIG.whatsapp.replace(/\D/g, "");
$("callBtn").href = "tel:" + CONFIG.phone;
$("mailBtn").href = "mailto:" + CONFIG.email;
$("mapBtn").href  = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.address);
$("siteBtn").href = CONFIG.website;

// أيقونات التواصل الاجتماعي
Object.entries(CONFIG.social).forEach(([key, url]) => {
  if (!url || !ICONS[key]) return;
  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  a.setAttribute("aria-label", SOCIAL_LABELS[key]);
  a.innerHTML = ICONS[key];
  $("social").appendChild(a);
});

/* ============ رسالة التأكيد ============ */
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ============ حفظ جهة الاتصال (vCard / VCF) ============ */
const vEsc = s => String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/;/g, "\\;").replace(/,/g, "\\,");

function buildVCard() {
  const parts = CONFIG.name.trim().split(/\s+/);
  const first = parts.shift() || "";
  const last  = parts.join(" ");
  return [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N;CHARSET=UTF-8:" + vEsc(last) + ";" + vEsc(first) + ";;;",
    "FN;CHARSET=UTF-8:" + vEsc(CONFIG.name),
    "ORG;CHARSET=UTF-8:" + vEsc(CONFIG.company),
    "TITLE;CHARSET=UTF-8:" + vEsc(CONFIG.title),
    "TEL;TYPE=CELL,VOICE:" + CONFIG.phone,
    "EMAIL;TYPE=INTERNET:" + CONFIG.email,
    "URL:" + CONFIG.website,
    "ADR;TYPE=WORK;CHARSET=UTF-8:;;" + vEsc(CONFIG.address) + ";;;;",
    "END:VCARD"
  ].join("\r\n");
}

$("saveBtn").addEventListener("click", () => {
  // علامة BOM تضمن ظهور الأسماء العربية بشكل صحيح
  const blob = new Blob(["\uFEFF" + buildVCard()], { type: "text/vcard;charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = CONFIG.name.trim().replace(/\s+/g, "_") + ".vcf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast("تم تنزيل الملف — افتحه لإضافة جهة الاتصال");
});

/* ============ مشاركة الكارت ============ */
// نسخ الرابط (يعمل حتى لو الـ Clipboard API غير متاح)
async function copyLink(url) {
  try {
    await navigator.clipboard.writeText(url);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = url;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, url.length);
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

$("shareBtn").addEventListener("click", async () => {
  const url = location.href;
  const shareData = {
    title: CONFIG.name + " | " + CONFIG.title,
    text:  "كارت " + CONFIG.name + " الشخصي",
    url:   url
  };

  // 1) المشاركة الأصلية (تحتاج رابط https)
  if (navigator.share) {
    try {
      await navigator.share(shareData);
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return; // المستخدم ألغى المشاركة
      // أي خطأ آخر: ننتقل لنسخ الرابط
    }
  }

  // 2) نسخ الرابط
  if (await copyLink(url)) {
    toast("تم نسخ الرابط ✅");
  } else {
    // 3) آخر حل: عرض الرابط ليُنسخ يدويًا
    window.prompt("انسخ رابط الكارت:", url);
  }
});
</script>
